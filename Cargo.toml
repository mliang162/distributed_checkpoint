[package]
name = "distributed_runtime-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "distributed_runtime_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.20.0", features = ["extension-module"] }
tokio = { version = "1.35.0", features = ["full"] }
object_store = { version = "0.9.0", features = ["aws"] }
tonic = "0.10.0"
prost = "0.12.0"
futures = "0.3.30"
bytes = "1.0"

[build-dependencies]
tonic-build = "0.10.0"
